name: Refresh ETF data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_etf_data.py
      - .github/workflows/update-etf-data.yml
  schedule:
    - cron: "17 0 * * 6"

permissions:
  contents: write

concurrency:
  group: refresh-etf-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data parser
        run: python -m pip install --disable-pip-version-check pandas lxml requests
      - name: Refresh ETF list
        run: python update_etf_data.py
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf-data.json
          if git diff --cached --quiet; then
            echo "ETF data has not changed."
          else
            git commit -m "Refresh Taiwan ETF data"
            git fetch origin main
            git rebase origin/main
            git push
          fi
